<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 단일 파일 탄막 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #444;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div class="info">
        이동: 방향키 또는 WASD | 발사: 자동
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태: 'MENU', 'PLAYING', 'LEADERBOARD', 'GAMEOVER', 'INPUT_NAME'
        let gameState = 'MENU'; 
        let score = 0;
        let lives = 3;
        let frameCount = 0;

        // 점수판 데이터 로드 (localStorage 이용)
        let leaderboard = JSON.parse(localStorage.getItem('danmaku_leaderboard')) || [];

        // 이름 입력 변수 (3글자 영어 제한)
        let inputName = '';

        // 키 입력 처리
        const keys = {};
        window.addEventListener('keydown', e => {
            // 이름 입력 상태일 때 특수 처리
            if (gameState === 'INPUT_NAME') {
                if (e.key === 'Backspace') {
                    inputName = inputName.slice(0, -1);
                } else if (e.key === 'Enter') {
                    if (inputName.length === 3) {
                        saveScore(inputName.toUpperCase(), score);
                        inputName = '';
                        gameState = 'LEADERBOARD';
                    }
                } else if (/^[a-zA-Z]$/.test(e.key) && inputName.length < 3) {
                    inputName += e.key.toUpperCase();
                }
                return;
            }

            keys[e.code] = true;

            if (gameState === 'MENU') {
                if (e.code === 'Digit1' || e.code === 'Numpad1' || e.code === 'Space') {
                    initGame();
                    gameState = 'PLAYING';
                } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
                    gameState = 'LEADERBOARD';
                }
            } else if (gameState === 'LEADERBOARD') {
                if (e.code === 'Space' || e.code === 'Escape' || e.code === 'Digit1' || e.code === 'Numpad1') {
                    gameState = 'MENU';
                }
            } else if (gameState === 'GAMEOVER') {
                if (e.code === 'Space') {
                    // 점수가 기록에 남을 만한지 체크 (TOP 5안에 들거나 널널할 때)
                    if (leaderboard.length < 5 || score > leaderboard[leaderboard.length - 1].score) {
                        gameState = 'INPUT_NAME';
                        inputName = '';
                    } else {
                        gameState = 'MENU';
                    }
                }
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        // 플레이어 객체
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            speed: 4,
            radius: 6,
            shootTimer: 0
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = [];

        function initGame() {
            score = 0;
            lives = 3;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            bullets = [];
            enemies = [];
            enemyBullets = [];
            particles = [];
            frameCount = 0;
            
            // 움직이는 보스 적 생성 (vx 속성 추가로 좌우 이동)
            enemies.push({
                x: canvas.width / 2,
                y: 100,
                vx: 1.5, // 좌우 이동 속도
                radius: 30,
                hp: 500,
                maxHp: 500,
                patternTimer: 0
            });
        }

        function saveScore(name, finalScore) {
            leaderboard.push({ name, score: finalScore });
            leaderboard.sort((a, b) => b.score - a.score);
            if (leaderboard.length > 5) leaderboard.pop(); // 상위 5개만 유지
            localStorage.setItem('danmaku_leaderboard', JSON.stringify(leaderboard));
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1.0,
                    color: color
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;

            // 1. 플레이어 이동
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > player.radius) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.radius) player.x += player.speed;
            if ((keys['ArrowUp'] || keys['KeyW']) && player.y > player.radius) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.radius) player.y += player.speed;

            // 2. 플레이어 총알 발사
            player.shootTimer++;
            if (player.shootTimer % 6 === 0) {
                bullets.push({ x: player.x - 8, y: player.y, vx: 0, vy: -12, radius: 4 });
                bullets.push({ x: player.x + 8, y: player.y, vx: 0, vy: -12, radius: 4 });
            }

            // 3. 총알 업데이트 (플레이어)
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < 0) bullets.splice(i, 1);
            }

            // 4. 적(보스) 움직임 및 탄막 패턴
            enemies.forEach(enemy => {
                enemy.patternTimer++;

                // 좌우 왕복 이동 로직
                enemy.x += enemy.vx;
                if (enemy.x < enemy.radius + 20 || enemy.x > canvas.width - enemy.radius - 20) {
                    enemy.vx *= -1; // 벽에 부딪히면 방향 반전
                }

                // 원형 탄막 패턴
                if (enemy.patternTimer % 15 === 0) {
                    const count = 12;
                    const offset = (enemy.patternTimer * 0.05) % (Math.PI * 2);
                    for (let i = 0; i < count; i++) {
                        const angle = offset + (i * Math.PI * 2) / count;
                        const speed = 2.5;
                        enemyBullets.push({
                            x: enemy.x, y: enemy.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: 4
                        });
                    }
                }

                // 조준 탄막 패턴
                if (enemy.patternTimer % 45 === 0) {
                    const angleToPlayer = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                    for (let i = -1; i <= 1; i++) {
                        const angle = angleToPlayer + i * 0.15;
                        const speed = 4;
                        enemyBullets.push({
                            x: enemy.x, y: enemy.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: 5
                        });
                    }
                }

                // 플레이어 총알과 적 충돌 체크
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    let dist = Math.hypot(b.x - enemy.x, b.y - enemy.y);
                    if (dist < enemy.radius + b.radius) {
                        enemy.hp -= 1;
                        score += 10;
                        createParticles(b.x, b.y, '#0ff', 2);
                        bullets.splice(i, 1);

                        if (enemy.hp <= 0) {
                            createParticles(enemy.x, enemy.y, '#ff0', 50);
                            score += 5000;
                            gameState = 'GAMEOVER';
                        }
                    }
                }
            });

            // 5. 적 탄막 업데이트 및 충돌 체크
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.vx;
                eb.y += eb.vy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                let dist = Math.hypot(eb.x - player.x, eb.y - player.y);
                if (dist < player.radius + eb.radius - 2) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    createParticles(player.x, player.y, '#f00', 20);
                    if (lives <= 0) {
                        gameState = 'GAMEOVER';
                    }
                }
            }

            // 6. 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // 화면 렌더링
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 메인 메뉴 화면
            if (gameState === 'MENU') {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('DANMAKU SHOOTER', canvas.width / 2, canvas.height / 2 - 60);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#0ff';
                ctx.fillText('1. 게임 시작 (스페이스바)', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#aaa';
                ctx.fillText('2. 점수판 보기', canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            // 2. 점수판 화면
            if (gameState === 'LEADERBOARD') {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LEADERBOARD', canvas.width / 2, 120);

                ctx.font = '16px sans-serif';
                if (leaderboard.length === 0) {
                    ctx.fillStyle = '#777';
                    ctx.fillText('기록된 점수가 없습니다.', canvas.width / 2, 220);
                } else {
                    leaderboard.forEach((item, index) => {
                        ctx.fillStyle = index === 0 ? '#ff0' : '#fff';
                        ctx.fillText(`${index + 1}.   ${item.name}   ---   ${item.score} pts`, canvas.width / 2, 180 + (index * 35));
                    });
                }

                ctx.fillStyle = '#0ff';
                ctx.font = '14px sans-serif';
                ctx.fillText('메뉴로 돌아가려면 스페이스바를 누르세요', canvas.width / 2, canvas.height - 100);
                return;
            }

            // 파티클 그리기
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 적(보스) 그리기
            enemies.forEach(enemy => {
                ctx.fillStyle = '#f33';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 보스 체력바
                ctx.fillStyle = '#444';
                ctx.fillRect(50, 20, canvas.width - 100, 8);
                ctx.fillStyle = '#f33';
                ctx.fillRect(50, 20, (canvas.width - 100) * (enemy.hp / enemy.maxHp), 8);
            });

            // 적 탄막 그리기
            ctx.fillStyle = '#f80';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 플레이어 총알 그리기
            ctx.fillStyle = '#0ff';
            bullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 8, 4, 10);
            });

            // 플레이어 그리기
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius - 4);
            ctx.lineTo(player.x - player.radius, player.y + player.radius);
            ctx.lineTo(player.x + player.radius, player.y + player.radius);
            ctx.closePath();
            ctx.fill();

            // 플레이어 판정점
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
            ctx.fill();

            // UI
            ctx.fillStyle = '#fff';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 50);
            ctx.fillText(`LIVES: ${'❤️'.repeat(lives)}`, 20, 70);

            // 3. 게임 오버 / 클리어 화면
            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(enemies[0].hp <= 0 ? 'VICTORY!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#0ff';
                ctx.fillText('스페이스바를 눌러 계속', canvas.width / 2, canvas.height / 2 + 40);
            }

            // 4. 영문 3글자 이름 입력 화면
            if (gameState === 'INPUT_NAME') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff0';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('TOP RANKING REACHED!', canvas.width / 2, canvas.height / 2 - 60);

                ctx.fillStyle = '#fff';
                ctx.font = '16px sans-serif';
                ctx.fillText('영어 3글자 닉네임을 입력하세요', canvas.width / 2, canvas.height / 2 - 20);

                // 입력 칸 시각화
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width / 2 - 60, canvas.height / 2 + 10, 120, 40);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px monospace';
                ctx.fillText(inputName + '_'.repeat(3 - inputName.length), canvas.width / 2, canvas.height / 2 + 37);

                ctx.fillStyle = '#888';
                ctx.font = '12px sans-serif';
                ctx.fillText('입력 완료 후 Enter 키를 누르세요', canvas.width / 2, canvas.height / 2 + 80);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
